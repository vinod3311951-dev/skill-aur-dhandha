name: Color Dominion FX19 Fixes and Regression

on:
  push:
    branches:
      - color-dominion-fx07-smoke-v2

permissions:
  contents: read

jobs:
  fx19-no-change-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify authorized repaired product runtime remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          # FX-19 originally proved no product change after FX-18.
          # FX-21 later made authorized mobile/performance repairs, so this
          # persistent downstream guard now freezes the final FX-21 runtime RC.
          BASE="f493d0820f48b8d95cee36fd2e2938fb2259fe1c"
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE"...HEAD | tee /tmp/fx19-diff.txt

          while IFS= read -r file; do
            case "$file" in
              index.html|styles.css|manifest.webmanifest|sw.js|server.mjs|package.json)
                echo "Unexpected product/runtime change after authorized FX-22 staging baseline: $file"
                exit 1
                ;;
              src/*|assets/*)
                echo "Unexpected product/runtime change after authorized FX-22 staging baseline: $file"
                exit 1
                ;;
              *)
                ;;
            esac
          done < /tmp/fx19-diff.txt

          echo "POST_FX22_PRODUCT_RUNTIME_CHANGE=NONE"

      - name: Re-run complete Node regression suite
        run: npm test

      - name: Verify critical PWA/runtime files remain present
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html styles.css manifest.webmanifest sw.js src/app.js src/engine.js src/stages.js src/integrations.js; do
            test -s "$f"
          done
          echo "FX19_CRITICAL_FILES=PASS"
