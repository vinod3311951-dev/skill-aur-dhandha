name: Color Dominion FX14 Regression

on:
  push:
    branches:
      - color-dominion-fx07-smoke-v2

permissions:
  contents: read

jobs:
  fx14-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit and FX-14 static regression
        run: npm test

      - name: PWA and IP presence gate
        shell: bash
        run: |
          test -f manifest.webmanifest
          test -f sw.js
          test -f docs/ip/IP_PROVENANCE_REGISTER.md
          test -f docs/ip/ASSET_REGISTER.csv
          test -f docs/ip/DEPENDENCY_LICENSE_REGISTER.md
          test -f docs/ip/MUSIC_SFX_RIGHTS_REGISTER.md
          test -f docs/ip/FONT_REGISTER.md
          test -f docs/ip/TRADEMARK_NAME_CHECK.md
          echo "PWA_IP_FILES=PASS"

      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Local mobile smoke
        shell: bash
        run: |
          node server.mjs > /tmp/color-dominion-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          page.on('pageerror',e=>errors.push('page:'+String(e)));
          const response=await page.goto('http://127.0.0.1:8080/',{waitUntil:'networkidle'});
          if(response?.status()!==200) throw new Error('home not 200');
          await page.locator('#settings-btn').click();
          await page.locator('#settings-screen').waitFor({state:'visible'});
          await page.locator('#settings-screen [data-home]').click();
          await page.locator('#map-btn').click();
          await page.locator('#map-screen').waitFor({state:'visible'});
          await page.locator('#map-screen [data-home]').click();
          await page.locator('#how-btn').click();
          await page.locator('#how-screen').waitFor({state:'visible'});
          await page.locator('#how-play-btn').click();
          await page.locator('#game').waitFor({state:'visible'});
          const stage=await page.locator('#stage-label').textContent();
          if(!stage?.includes('Stage 1')) throw new Error('stage 1 not reached');
          await page.locator('#pause-btn').click();
          await page.locator('#pause-overlay').waitFor({state:'visible'});
          await page.locator('#resume-btn').click();
          if(errors.length) throw new Error(errors.join('\n'));
          console.log('MOBILE_SMOKE=PASS');
          await browser.close();
          NODE
