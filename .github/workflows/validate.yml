name: Validate Factory X

on:
  push:
    branches:
      - factory-x/vertical-slice-01
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build
        run: npm run build
      - name: Validate PWA shell
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icon.svg
          grep -q 'manifest.webmanifest' dist/index.html
          grep -q 'serviceWorker' dist/index.html
          grep -q '"display": "standalone"' dist/manifest.webmanifest
          grep -q '"start_url": "/"' dist/manifest.webmanifest
          grep -q "caches.open" dist/sw.js
          grep -q "self.addEventListener('fetch'" dist/sw.js
          echo 'PWA shell validation passed.'
      - name: Validate frozen safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f src/path-routes.ts
          test -f src/gov.ts
          test -f src/market.ts
          test -f src/paisa.ts
          grep -qi 'does not broker' src/path-routes.ts
          grep -qi 'does not process government applications' src/gov.ts
          grep -qi 'Aadhaar' src/gov.ts
          grep -qi 'PAN' src/gov.ts
          grep -qi 'payments' src/market.ts
          grep -qi 'commissions' src/market.ts
          grep -qi 'Aadhaar/PAN' src/paisa.ts
          grep -qi 'payment information' src/paisa.ts
          grep -Fq 'does not infer demand, profit or eligibility' src/guided-filters.ts
          echo 'Frozen privacy/platform boundaries present.'
      - name: Validate blueprint coverage
        shell: bash
        run: |
          set -euo pipefail
          for f in src/guided-filters.ts src/possibilities.ts src/path-routes.ts src/market.ts src/paisa.ts src/learn.ts src/gov.ts src/s1c.ts src/s13-journey.ts; do test -f "$f"; done
          grep -q '17 or under' src/guided-filters.ts
          grep -q '60+' src/guided-filters.ts
          grep -q 'Gender (optional)' src/guided-filters.ts
          grep -q 'Investment preference' src/guided-filters.ts
          grep -q 'Time available' src/guided-filters.ts
          grep -q 'Operating location' src/guided-filters.ts
          grep -q 'Broad geography' src/guided-filters.ts
          grep -Fq 'Suggested ·' src/guided-filters.ts
          for category in 'Food' 'Retail' 'Service / Skill' 'Manufacturing' 'Agriculture / Farm Business' 'Digital / Online' 'Home-based'; do grep -Fq "$category" src/possibilities.ts; done
          for factor in 'Investment' 'Demand' 'Competition' 'Risk' 'Profit potential' 'Time to income' 'Difficulty' 'Skills needed' 'Government support' 'Space needed' 'Scalability' 'Seasonal risk' 'Legal requirements' 'Digital opportunity' 'Long-term outlook'; do grep -Fq "$factor" src/possibilities.ts; done
          grep -Fq '5-Step Decision Journey' src/s13-journey.ts
          grep -Fq 'Step ${i+1} of ${steps.length}' src/s13-journey.ts
          grep -Fq 'YOUR CALCULATION' src/s13-journey.ts
          grep -Fq 'Break-even meals / month' src/s13-journey.ts
          grep -Fq 'Modeled surplus / shortfall' src/s13-journey.ts
          grep -Fq '5-step practice roadmap' src/learn.ts
          grep -Fq 'Before paying for a course' src/learn.ts
          grep -Fq 'National Career Service' src/gov.ts
          grep -Fq 'Verify before you act' src/gov.ts
          grep -Fq 'Skill India Digital' src/learn.ts
          grep -Fq 'TEST MODE' src/s1c.ts
          grep -Fq '₹0 charged' src/s1c.ts
          grep -Fq 'Enter business assumptions' src/paisa.ts
          grep -Fq 'Break-even units / month' src/paisa.ts
          grep -Fq 'Simple startup recovery' src/paisa.ts
          grep -Fq 'not a forecast' src/paisa.ts
          echo 'Blueprint coverage checks passed.'
      - name: Validate navigation and compare workflows
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'marketRoot' src/market.ts
          grep -Fq 'Compare routes' src/market.ts
          grep -Fq 'Compare route requirements' src/market.ts
          grep -Fq 'Unknowns remain unknown' src/market.ts
          grep -Fq 'paisaRoot' src/paisa.ts
          grep -Fq 'paisa-business-calc' src/paisa.ts
          grep -Fq 'reportRoot' src/s1c.ts
          grep -Fq 'Compare before deciding' src/path-routes.ts
          grep -Fq 'Choose an alternative' src/path-routes.ts
          grep -Fq 'path-alt' src/path-routes.ts
          grep -Fq 'Low-risk test' src/path-routes.ts
          grep -Fq 'business-compare-back' src/possibilities.ts
          grep -Fq 'learn-roadmap-back' src/learn.ts
          echo 'Navigation and comparison workflow checks passed.'
