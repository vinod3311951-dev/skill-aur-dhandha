name: Validate Factory X
on:
  push:
    branches: [factory-x/vertical-slice-01]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build
        run: npm run build
      - name: Validate PWA shell
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/index.html dist/manifest.webmanifest dist/sw.js dist/icon.svg; do test -f "$f"; done
          grep -q 'manifest.webmanifest' dist/index.html
          grep -q 'serviceWorker' dist/index.html
          grep -q '"display": "standalone"' dist/manifest.webmanifest
          grep -q '"start_url": "/"' dist/manifest.webmanifest
          grep -q '"theme_color": "#31704b"' dist/manifest.webmanifest
          grep -q 'caches.open' dist/sw.js
      - name: Validate frozen safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          for f in src/path-routes.ts src/gov.ts src/market.ts src/paisa.ts src/guided-filters.ts; do test -f "$f"; done
          grep -qi 'does not broker' src/path-routes.ts
          grep -qi 'does not submit applications' src/gov.ts
          grep -qi 'Aadhaar' src/gov.ts
          grep -qi 'PAN' src/gov.ts
          grep -qi 'payments' src/market.ts
          grep -qi 'commissions' src/market.ts
          grep -qi 'Aadhaar' src/paisa.ts
          grep -qi 'PAN' src/paisa.ts
          grep -Fq 'Do not infer tax from an MSME/SME label' src/paisa.ts
          grep -Fq 'no name, exact DOB, address, Aadhaar, PAN or bank information' src/guided-filters.ts
          ! grep -Fq 'type="email"' src/*.ts
          ! grep -Fq 'type="password"' src/*.ts
      - name: Validate corrected blueprint coverage
        shell: bash
        run: |
          set -euo pipefail
          for f in src/main.ts src/guided-filters.ts src/possibilities.ts src/manufacturing-machines.ts src/path-routes.ts src/market.ts src/paisa.ts src/learn.ts src/gov.ts; do test -f "$f"; done
          for term in '17 or under' '60+' 'Gender (optional)' 'Investment preference' 'Time available' 'Operating location' 'Broad geography'; do grep -Fq "$term" src/guided-filters.ts; done
          for category in 'Food' 'Retail' 'Service / Skill' 'Manufacturing' 'Agriculture / Farm Business' 'Digital / Online' 'Home-based'; do grep -Fq "$category" src/possibilities.ts; done
          for factor in 'Investment' 'Demand' 'Competition' 'Risk' 'Profit potential' 'Time to income' 'Difficulty' 'Skills needed' 'Government support' 'Space needed' 'Scalability' 'Seasonal risk' 'Legal requirements' 'Digital opportunity' 'Long-term outlook'; do grep -Fq "$factor" src/possibilities.ts; done
          grep -Fq 'Needs & Requirements' src/possibilities.ts
          grep -Fq 'Pan-India research' src/possibilities.ts
          grep -Fq '15-factor comparison' src/possibilities.ts
          grep -Fq '₹20,000 band' src/manufacturing-machines.ts
          grep -Fq '₹50,000 band' src/manufacturing-machines.ts
          grep -Fq '₹1,00,000 band' src/manufacturing-machines.ts
          grep -Fq 'affiliate links' src/manufacturing-machines.ts
          grep -Fq 'YOUR CALCULATION' src/paisa.ts
          grep -Fq 'Adaptive business calculator' src/paisa.ts
          grep -Fq 'Tax & Compliance Check' src/paisa.ts
          grep -Fq 'Save My Plan' src/paisa.ts
          grep -Fq 'Pan-India research lens' src/learn.ts
          grep -Fq 'Things to check before proceeding' src/learn.ts
          grep -Fq 'Things to check before proceeding' src/gov.ts
          grep -Fq 'Need local-language help?' src/gov.ts
          grep -Fq 'Where the service or scheme is supported through India Post' src/gov.ts
          grep -Fq 'https://www.indiapost.gov.in/' src/gov.ts
      - name: Validate dropdown-first and plan handoff
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Choose from ${list.length} learning options' src/learn.ts
          grep -Fq 'Other / type my topic' src/learn.ts
          grep -Fq 'Compare two routes' src/market.ts
          grep -Fq 'market-compare-a' src/market.ts
          grep -Fq 'market-compare-b' src/market.ts
          grep -Fq 'routeLens' src/market.ts
          grep -Fq 'data-business-band' src/paisa.ts
          grep -Fq 'Other / enter manually' src/paisa.ts
          grep -Fq 'open-paisa-business' src/paisa.ts
          grep -Fq 'open-paisa-business' src/possibilities.ts
          grep -Fq 'skill-aur-dhandha-opportunity-plan' src/possibilities.ts
          grep -Fq 'Save My Plan on this device' src/possibilities.ts
          grep -Fq 'Compare with a similar opportunity' src/possibilities.ts
          grep -Fq 'business-compare-a' src/possibilities.ts
          grep -Fq 'business-compare-b' src/possibilities.ts
          grep -Fq 'my entry' src/possibilities.ts
          grep -Fq 'Choose from ${route.items.length} directions' src/path-routes.ts
      - name: Validate hardened calculator safety math
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'fixedMonthly=rent+marketing+distribution+transport+staff+utilities' src/paisa.ts
          grep -Fq 'variablePerUnit=units>0?raw/units:null' src/paisa.ts
          grep -Fq 'Math.ceil(fixedMonthly/unitContribution)' src/paisa.ts
          grep -Fq 'Indicative operating break-even units' src/paisa.ts
          grep -Fq 'Break-even method:' src/paisa.ts
          grep -Fq 'Simple startup-cost recovery' src/paisa.ts
          grep -Fq 'owner salary/labour' src/paisa.ts
          ! grep -Fq 'Math.ceil((monthly-raw)/unitContribution)' src/paisa.ts
      - name: Validate navigation and corrected workflows
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "type Screen='home'|'path'" src/main.ts
          grep -Fq 'skill-return-to-path' src/main.ts
          grep -Fq 'app-language' src/main.ts
          grep -Fq 'app-settings' src/main.ts
          grep -Fq 'utility-back' src/main.ts
          grep -Fq 'Any Indian language' src/main.ts
          grep -Fq 'skill-return-to-path' src/guided-filters.ts
          grep -Fq 'skill-return-to-path' src/path-routes.ts
          grep -Fq 'market-type-select' src/market.ts
          grep -Fq 'market-route-select' src/market.ts
          grep -Fq 'market-compare-back' src/market.ts
          grep -Fq 'market-checks-back' src/market.ts
          grep -Fq 'paisa-mode-select' src/paisa.ts
          grep -Fq 'paisa-business-calc' src/paisa.ts
          grep -Fq 'paisa-business-edit' src/paisa.ts
          grep -Fq 'business-compare-back' src/possibilities.ts
          grep -Fq 'business-journey-back' src/possibilities.ts
          grep -Fq 'data-machine-explorer' src/possibilities.ts
          grep -Fq 'machine-budget' src/manufacturing-machines.ts
          grep -Fq 'machine-detail-back' src/manufacturing-machines.ts
          grep -Fq 'learn-roadmap-back' src/learn.ts
          grep -Fq 'learn-readiness-back' src/learn.ts
          grep -Fq 'gov-mode-select' src/gov.ts
          grep -Fq 'Compare before deciding' src/path-routes.ts
      - name: Validate local utility settings
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "type Lang='English'|'Hindi'|'Roman Hindi'" src/main.ts
          grep -Fq 'skill-aur-dhandha-language' src/main.ts
          grep -Fq 'language-select' src/main.ts
          grep -Fq 'saved readiness preference' src/main.ts
          grep -Fq 'skill-aur-dhandha-reduced-motion' src/main.ts
          grep -Fq 'motion-select' src/main.ts
          grep -Fq 'clear-local-plans' src/main.ts
          grep -Fq 'data-reduced-motion' src/style.css
      - name: Validate Indian-language voice foundation
        shell: bash
        run: |
          set -euo pipefail
          test -f src/voice.ts
          test -f docs/VOICE-LANGUAGE-ARCHITECTURE.md
          grep -Fq '/src/voice.ts' index.html
          grep -Fq 'SpeechRecognition' src/voice.ts
          grep -Fq 'SpeechSynthesisUtterance' src/voice.ts
          grep -Fq 'supportedLocales' src/voice.ts
          grep -Fq "'hi-IN'" src/voice.ts
          grep -Fq "'ta-IN'" src/voice.ts
          grep -Fq "'te-IN'" src/voice.ts
          grep -Fq "'bn-IN'" src/voice.ts
          grep -Fq 'No always-on microphone' docs/VOICE-LANGUAGE-ARCHITECTURE.md
          grep -Fq 'response in the same language as text' docs/VOICE-LANGUAGE-ARCHITECTURE.md
          grep -Fq 'Do not embed provider secrets in the PWA client' docs/VOICE-LANGUAGE-ARCHITECTURE.md
          grep -Fq '22 scheduled languages' docs/VOICE-LANGUAGE-ARCHITECTURE.md
      - name: Validate local-only plan architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "localStorage.setItem('skill-aur-dhandha-opportunity-plan'" src/possibilities.ts
          grep -Fq "localStorage.setItem('skill-aur-dhandha-business-calculation'" src/paisa.ts
          grep -Fq 'Nothing is sent to a server' src/possibilities.ts
          grep -Fq 'Calculating:' src/paisa.ts
          grep -Fq 'Edit assumptions' src/paisa.ts
      - name: Validate source provenance register
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'myScheme' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'Udyam Registration' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'Income Tax Department e-Filing' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'Goods and Services Tax (GST) Common Portal' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'National Single Window System' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'National Career Service' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'e-Shram' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'Skill India Digital — DGT ITI route' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'FSSAI / FoSCoS' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'Department of Agriculture & Farmers Welfare' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq "Small Farmers' Agribusiness Consortium" docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'National Agriculture Market (e-NAM)' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'Open Network for Digital Commerce' docs/OFFICIAL-SOURCE-REGISTER.md
          grep -Fq 'no private intermediary or affiliate route may masquerade as an official portal' docs/OFFICIAL-SOURCE-REGISTER.md
      - name: Reject legacy runtime modules
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '/src/s1c.ts' index.html
          ! grep -Fq '/src/s13-journey.ts' index.html
