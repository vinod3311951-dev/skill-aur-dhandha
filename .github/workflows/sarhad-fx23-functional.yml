name: Sarhad FX-23 Functional QA

on:
  push:
    branches: [sarhad-sniper-deploy]
    paths:
      - "build.mjs"
      - "qa/fx23-functional.spec.js"
      - "qa/static-server.mjs"
      - "qa/tests/smoke.spec.js"
      - ".github/workflows/sarhad-fx23-functional.yml"

permissions:
  contents: write

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sarhad-sniper-deploy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build repaired static PWA
        run: node build.mjs
      - name: Install Playwright
        working-directory: qa
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Start static QA server
        run: |
          node qa/static-server.mjs > /tmp/sarhad-static.log 2>&1 &
          echo $! > /tmp/sarhad-static.pid
          sleep 2
      - name: Run FX-23 functional tests
        working-directory: qa
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npx playwright test tests/fx23-functional.spec.js tests/smoke.spec.js --project=local-android-chrome --project=local-iphone-webkit --reporter=line
