name: Sarhad FX-23 Functional QA

on:
  push:
    branches: [sarhad-sniper-deploy, fx-01-audit1]
    paths:
      - "build.mjs"
      - "qa/fx23-functional.spec.js"
      - "qa/static-server.mjs"
      - "qa/tests/smoke.spec.js"
      - ".github/workflows/sarhad-fx23-functional.yml"

permissions:
  contents: write

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build repaired static PWA
        run: node build.mjs
      - name: Upload reconstructed public build
        uses: actions/upload-artifact@v4
        with:
          name: sarhad-public-build
          path: public/
          retention-days: 7
      - name: Install Playwright
        working-directory: qa
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Start static QA server
        run: |
          node qa/static-server.mjs > /tmp/sarhad-static.log 2>&1 &
          echo $! > /tmp/sarhad-static.pid
          sleep 2
      - name: Run FX-23 functional tests
        working-directory: qa
        env:
          GAME_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/fx23-functional.spec.js tests/smoke.spec.js --project=local-android-chrome --project=local-iphone-webkit --reporter=line 2>&1 | tee ../FX01_QA_LOG.txt
      - name: Commit FX-01 QA diagnostic log
        if: always()
        working-directory: .
        shell: bash
        run: |
          git config user.name "factory-x-qa"
          git config user.email "factory-x-qa@users.noreply.github.com"
          git add FX01_QA_LOG.txt || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "FX-01: capture functional QA diagnostic"
          git push origin HEAD:fx-01-audit1
