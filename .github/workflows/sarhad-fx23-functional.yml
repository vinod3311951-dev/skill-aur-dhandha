name: Sarhad FX-23 Functional QA

on:
  push:
    branches: [sarhad-sniper-deploy, fx-01-audit1, fx-01-phaser3-presentation, fx-01-all-worlds-audit]
    paths:
      - "build.mjs"
      - "sarhad-inspect/**"
      - "qa/**"
      - ".github/workflows/sarhad-fx23-functional.yml"

concurrency:
  group: sarhad-fx23-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Build repaired static PWA
        run: node build.mjs
      - name: Upload reconstructed public build
        uses: actions/upload-artifact@v4
        with:
          name: sarhad-public-build
          path: public/
          retention-days: 7
      - name: Validate deterministic mission and combat state
        run: |
          node qa/tests/mission-config.test.mjs
          node qa/tests/combat-state.test.mjs
          node qa/tests/loadout-state.test.mjs
      - name: Install QA dependencies
        working-directory: qa
        timeout-minutes: 3
        run: npm install --no-audit --no-fund
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('qa/package.json') }}
      - name: Install Playwright OS dependencies
        working-directory: qa
        timeout-minutes: 9
        run: npx playwright install-deps chromium webkit
      - name: Install Playwright browsers
        working-directory: qa
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - name: Start static QA server
        run: |
          node qa/static-server.mjs > /tmp/sarhad-static.log 2>&1 &
          echo $! > /tmp/sarhad-static.pid
          sleep 2
      - name: Run FX-23 functional tests
        working-directory: qa
        env:
          GAME_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/fx23-functional.spec.js --project=local-android-chrome --project=local-iphone-webkit --workers=2 --reporter=line 2>&1 | tee ../FX01_QA_LOG.txt
          npx playwright test tests/smoke.spec.js --project=local-android-chrome --workers=1 --repeat-each=2 --reporter=line 2>&1 | tee -a ../FX01_QA_LOG.txt
          npx playwright test tests/smoke.spec.js --project=local-iphone-webkit --workers=1 --repeat-each=2 --reporter=line 2>&1 | tee -a ../FX01_QA_LOG.txt
      - name: Capture exhaustive 105-mission rendered audit on Android and WebKit
        working-directory: qa
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npx playwright test tests/all-worlds-render.spec.js --project=local-android-chrome --project=local-iphone-webkit --workers=4 --reporter=line

      - name: Capture built World-1 signature visual slice on Android and WebKit
        working-directory: qa
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npx playwright test tests/visual-slice.spec.js --project=local-android-chrome --project=local-iphone-webkit --workers=2 --reporter=line
      - name: Upload FX-01 visual slice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx01-visual-evidence
          path: |
            qa/test-results/**/fx01-*.png
            qa/test-results/**/world-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload FX-01 QA diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx01-qa-log
          path: FX01_QA_LOG.txt
          retention-days: 7
