name: Sarhad BrowserStack QA

on:
  workflow_dispatch:
  push:
    branches:
      - sarhad-browserstack-gate

jobs:
  real-device-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: qa
    env:
      GAME_URL: https://sarhad-sniper-production.up.railway.app/
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: sarhad-browserstack-gate

      - name: Validate BrowserStack credentials
        shell: bash
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "::error::BrowserStack GitHub Actions secrets are missing. Set BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY before running the real-device gate."
            exit 2
          fi

      - name: BrowserStack environment setup
        uses: browserstack/github-actions/setup-env@master
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          build-name: 'sarhad-sniper-real-device-gate'
          project-name: 'Sarhad Sniper'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/package.json

      - name: Install QA dependencies
        run: npm install --no-audit --no-fund

      - name: Run BrowserStack real-device gates
        run: npm run test:bs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarhad-browserstack-evidence
          path: |
            qa/results.json
            qa/playwright-report/
            qa/test-results/
          if-no-files-found: ignore
