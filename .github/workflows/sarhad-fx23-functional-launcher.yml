name: Sarhad FX-23 Functional QA Launcher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sarhad-fx23-functional-launcher.yml"

permissions:
  contents: write

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sarhad-sniper-deploy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build repaired Sarhad PWA
        run: node build.mjs
      - name: Install Playwright
        working-directory: qa
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Start local static server
        run: |
          node qa/static-server.mjs > /tmp/sarhad-static.log 2>&1 &
          echo $! > /tmp/sarhad-static.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
      - name: Run FX-23 functional tests
        working-directory: qa
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npx playwright test tests/fx23-functional.spec.js tests/smoke.spec.js --project=local-android-chrome --project=local-iphone-webkit --reporter=line
      - name: Record pass evidence on Sarhad branch
        if: success()
        run: |
          printf 'SARHAD FX-23 FUNCTIONAL QA PASS\nsource_branch=sarhad-sniper-deploy\nrepair_commit=251fb803d414d41cc801748ed45ebba8be232d4d\nchecks=level1-play-score,progression-level2,levels5-10-25-50-100-open-play,android-chrome-smoke,iphone-webkit-smoke\n' > SARHAD_FX23_FUNCTIONAL_QA_PASS.txt
          git config user.name "factory-x-qa"
          git config user.email "factory-x-qa@users.noreply.github.com"
          git add SARHAD_FX23_FUNCTIONAL_QA_PASS.txt
          git commit -m "qa: record Sarhad FX-23 functional pass"
          git push origin HEAD:sarhad-sniper-deploy
