name: Sarhad Source Extraction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sarhad-source-extract.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sarhad-sniper-deploy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct Sarhad package
        run: node build.mjs
      - name: Export inspectable source
        run: |
          rm -rf sarhad-inspect
          mkdir -p sarhad-inspect
          find public -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.css' \) -print0 | while IFS= read -r -d '' f; do
            rel="${f#public/}"
            mkdir -p "sarhad-inspect/$(dirname "$rel")"
            cp "$f" "sarhad-inspect/$rel"
          done
          find sarhad-inspect -type f | sort > sarhad-inspect/FILELIST.txt
      - name: Commit extracted source to Sarhad branch
        run: |
          git config user.name "factory-x-diagnostic"
          git config user.email "factory-x-diagnostic@users.noreply.github.com"
          git add sarhad-inspect
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diagnostic: expose Sarhad packaged source for repair"
          git push origin HEAD:sarhad-sniper-deploy
