name: Sarhad Live Functional Diagnostic
on:
  push:
    branches: [sarhad-sniper-deploy]
    paths:
      - "qa/live-functional-diagnostic.js"
      - ".github/workflows/sarhad-live-diagnostic.yml"
      - "SARHAD_LIVE_DIAGNOSTIC_TRIGGER.txt"
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa
    env:
      GAME_URL: https://sarhad-sniper-production.up.railway.app/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sarhad-sniper-deploy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install diagnostic dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live functional diagnostic
        run: node live-functional-diagnostic.js
      - name: Commit diagnostic report
        working-directory: .
        run: |
          cp qa/SARHAD_LIVE_DIAGNOSTIC_REPORT.txt ./SARHAD_LIVE_DIAGNOSTIC_REPORT.txt
          git config user.name "factory-x-diagnostic"
          git config user.email "factory-x-diagnostic@users.noreply.github.com"
          git add SARHAD_LIVE_DIAGNOSTIC_REPORT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diagnostic: capture Sarhad live mission flow"
          git push origin HEAD:sarhad-sniper-deploy
