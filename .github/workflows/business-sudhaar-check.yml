name: Business Sudhaar Release Check
on:
  push:
    branches:
      - business-sudhaar/vertical-slice-01
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Release gate
        run: npm run check
      - name: Android + Apple automated mobile gate
        run: npm run test:mobile