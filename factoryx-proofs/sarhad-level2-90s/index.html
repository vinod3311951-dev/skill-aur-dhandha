<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>Sarhad Sniper — Level 2 Proof</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071018;font-family:system-ui;color:white}canvas{width:100%;height:100%;touch-action:none;display:block}#fire{position:fixed;right:18px;bottom:24px;width:82px;height:82px;border-radius:50%;border:2px solid #ffb13b;background:#b92b1dcc;color:white;font-weight:900;font-size:17px;box-shadow:0 0 30px #ff7b2255}#hint{position:fixed;left:16px;bottom:20px;font-size:12px;opacity:.8;max-width:55vw}</style></head><body><canvas id='c'></canvas><button id='fire'>PULSE</button><div id='hint'>DRAG TO AIM • 3 SHOTS • HOLD STILL TO SETTLE</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'); let W,H,D=devicePixelRatio||1; function rs(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)} addEventListener('resize',rs);rs();
let t=0,aimX=.63,aimY=.49,drag=false,shots=3,flash=0,shake=0,settle=0,lastMove=null,flight=null,hitText='',hitT=0,score=0,scope=1,started=performance.now(),state='ACTIVE';
const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random()*.55,s:Math.random()*1.5+.4}));
const rain=Array.from({length:120},()=>({x:Math.random(),y:Math.random(),z:Math.random()*.8+.2}));
function poly(points,fill){x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=fill;x.fill()}
function world(){let sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;x.save();x.translate(sx,sy);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071828');g.addColorStop(.52,'#16364b');g.addColorStop(1,'#1c2a2d');x.fillStyle=g;x.fillRect(0,0,W,H);
stars.forEach(s=>{x.globalAlpha=.25+.25*Math.sin(t+s.x*9);x.fillStyle='#d8f1ff';x.fillRect(s.x*W,s.y*H,s.s,s.s)});x.globalAlpha=1;
let px=(aimX-.5)*-24; poly([[-60+px,H*.62],[W*.10+px,H*.32],[W*.24+px,H*.58],[W*.38+px,H*.27],[W*.58+px,H*.61],[W*.76+px,H*.30],[W+70+px,H*.60],[W+70,H],[-60,H]],'#173847');
poly([[-40+px*.7,H*.67],[W*.18+px*.7,H*.43],[W*.36+px*.7,H*.66],[W*.53+px*.7,H*.38],[W*.72+px*.7,H*.65],[W*.9+px*.7,H*.44],[W+50,H*.68],[W+50,H],[-40,H]],'#244957');
let wx=W*.22+px*.4;x.fillStyle='#a9e4ef66';x.fillRect(wx,H*.44,W*.035,H*.34);x.fillStyle='#d6fbff88';x.fillRect(wx+W*.012,H*.44,W*.008,H*.34);
poly([[0,H*.73],[W*.18,H*.65],[W*.38,H*.74],[W*.57,H*.62],[W*.77,H*.72],[W,H*.63],[W,H],[0,H]],'#0d2025');
let tx=W*.67+(Math.sin(t*.35)*W*.035), ty=H*.49+Math.sin(t*.8)*6; x.strokeStyle='#314d55';x.lineWidth=7;x.beginPath();x.moveTo(tx,H*.77);x.lineTo(tx,ty-80);x.stroke();
x.fillStyle='#263c42';x.fillRect(tx-42,ty-50,84,100);x.strokeStyle='#6d8990';x.lineWidth=3;x.strokeRect(tx-42,ty-50,84,100);
let open=(Math.sin(t*1.45)+1)/2; x.save();x.translate(tx,ty);x.rotate(t*.18);x.fillStyle='#a85d2a';x.beginPath();x.arc(0,0,31,0,Math.PI*2);x.fill();x.fillStyle='#09161b';x.beginPath();x.arc(0,0,10+open*12,0,Math.PI*2);x.fill();x.restore();
x.strokeStyle='#9bbcc1';x.lineWidth=3;x.beginPath();x.arc(tx,ty-76,22,Math.PI*.15,Math.PI*.85);x.stroke();x.save();x.translate(tx,ty-76);x.rotate(Math.sin(t*.7)*.6);x.beginPath();x.moveTo(0,0);x.lineTo(30,-8);x.stroke();x.restore();
rain.forEach(r=>{r.y+=.004*r.z;if(r.y>1){r.y=-.1;r.x=Math.random()}x.strokeStyle=`rgba(190,230,240,${.12+.25*r.z})`;x.lineWidth=r.z*1.4;x.beginPath();x.moveTo(r.x*W,r.y*H);x.lineTo(r.x*W-7*r.z,r.y*H+18*r.z);x.stroke()});
let mist=x.createLinearGradient(0,H*.55,0,H);mist.addColorStop(0,'#b9e7e700');mist.addColorStop(.55,'#b9e7e71d');mist.addColorStop(1,'#b9e7e705');x.fillStyle=mist;x.fillRect(0,H*.5,W,H*.5);
if(flight){let q=Math.min(1,(t-flight.t)/.75), ex=flight.tx,ey=flight.ty, bx=flight.sx+(ex-flight.sx)*q,by=flight.sy+(ey-flight.sy)*q-90*Math.sin(Math.PI*q);x.strokeStyle='#78f4ff';x.lineWidth=3;x.beginPath();x.moveTo(bx-25,by+8);x.lineTo(bx,by);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(bx,by,4,0,7);x.fill();if(q>=1){let d=Math.hypot(ex-tx,ey-ty);if(d<22&&open>.55){score++;hitText='COUPLER LOCKED';}else if(d<42){hitText='GRAZE — ADJUST';}else hitText='MISS — READ WIND';hitT=t;shake=12;flash=1;flight=null}}
let ax=aimX*W,ay=aimY*H;x.strokeStyle='#d8f7ffcc';x.lineWidth=1;x.beginPath();x.arc(ax,ay,48,0,7);x.stroke();x.beginPath();x.moveTo(ax-70,ay);x.lineTo(ax+70,ay);x.moveTo(ax,ay-70);x.lineTo(ax,ay+70);x.stroke();x.fillStyle=settle>1.4?'#66ffb3':'#ffcb66';x.fillRect(ax-3,ay-3,6,6);
x.fillStyle='#061017bb';x.fillRect(12,12,Math.min(340,W-24),86);x.fillStyle='#fff';x.font='700 13px system-ui';x.fillText('SARHAD SNIPER • LEVEL 2',24,34);x.font='900 21px system-ui';x.fillText('MONSOON RELAY',24,58);x.font='12px system-ui';x.fillStyle='#a8c8d2';x.fillText(`SHOTS ${shots}/3   SCORE ${score}   WIND ${(Math.sin(t*.47)*8).toFixed(1)}`,24,80);
if(hitText&&t-hitT<2.2){x.font='900 22px system-ui';x.fillStyle='#fff';x.textAlign='center';x.fillText(hitText,W/2,H*.2);x.textAlign='left'}
let elapsed=(performance.now()-started)/1000;if(elapsed>=90&&state==='ACTIVE'){state=score>0?'SUCCESS':'FAILED';hitText=state==='SUCCESS'?'RELAY STABILIZED':'MISSION FAILED';hitT=t}x.fillStyle='#ffffff22';x.fillRect(12,H-10,W-24,3);x.fillStyle='#ffb13b';x.fillRect(12,H-10,(W-24)*Math.min(elapsed/90,1),3);
if(elapsed>80){x.textAlign='center';x.font='900 28px system-ui';x.fillStyle='#fff';x.fillText(state==='SUCCESS'?'RELAY STABILIZED':state==='FAILED'?'MISSION FAILED':score?'HOLD THE RELAY':'MISSION WINDOW CLOSING',W/2,H*.14);x.textAlign='left'}
x.restore();shake*=.86;flash*=.82;if(flash>.02){x.fillStyle=`rgba(255,240,210,${flash*.35})`;x.fillRect(0,0,W,H)}}
function loop(now){let nt=now/1000,dt=Math.min(.033,nt-t||.016);t=nt;settle=lastMove===null?0:(t-lastMove);world();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function pos(e){let p=e.touches?e.touches[0]:e;return [p.clientX/W,p.clientY/H]}
c.addEventListener('pointerdown',e=>{drag=true;let p=pos(e);aimX=p[0];aimY=p[1];lastMove=t});c.addEventListener('pointermove',e=>{if(!drag)return;let p=pos(e);aimX=Math.max(.08,Math.min(.92,p[0]));aimY=Math.max(.18,Math.min(.82,p[1]));lastMove=t});addEventListener('pointerup',()=>drag=false);
function fire(){if(state!=='ACTIVE'||shots<=0||flight||settle<1.4)return;shots--;let wind=Math.sin(t*.47)*8;flight={t,sx:W*.12,sy:H*.78,tx:aimX*W+wind*3,ty:aimY*H};shake=6;flash=.6}document.querySelector('#fire').onclick=fire;addEventListener('keydown',e=>{if(e.code==='Space')fire()});
</script></body></html>
