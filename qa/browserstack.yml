framework: playwright
projectName: game-autotest
buildName: sarhad-sniper-real-device-gate
browserstackLocal: false
platforms:
  - deviceName: Samsung Galaxy M32
    osVersion: 11.0
    browserName: chrome
  - deviceName: Samsung Galaxy S22 Ultra
    osVersion: 12.0
    browserName: chrome
  - deviceName: Google Pixel 8
    osVersion: 14.0
    browserName: chrome
  - deviceName: iPhone 16
    osVersion: 18
    browserName: safari
parallelsPerPlatform: 1
maxParallelTests: 1
# BrowserStack documents a 90s default idle timeout and allows up to 300s.
idleTimeout: 300
# Keep heavy diagnostics off for the normal gate; GitHub still retains
# Playwright failure screenshots/traces/results as evidence.
debug: false
networkLogs: false
video: false
