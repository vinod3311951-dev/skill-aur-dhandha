framework: playwright
projectName: game-autotest
buildName: sarhad-sniper-real-device-gate
browserstackLocal: false
platforms:
  - deviceName: Samsung Galaxy M32
    osVersion: 11.0
    browserName: chrome
  - deviceName: Samsung Galaxy S22 Ultra
    osVersion: 12.0
    browserName: chrome
  - deviceName: Google Pixel 8
    osVersion: 14.0
    browserName: chrome
  - deviceName: iPhone 16
    osVersion: 18
    browserName: safari
# Keep the real-device gate deliberately sequential. The suite repeats each
# test three times; launching four device projects concurrently can exhaust
# low-parallel BrowserStack plans/queues before useful evidence is collected.
parallelsPerPlatform: 1
maxParallelTests: 1
debug: true
networkLogs: true
video: true
