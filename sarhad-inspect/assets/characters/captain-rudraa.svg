<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Captain Rudraa</title>
<desc id="desc">Stylised fictional precision specialist in graphite field jacket with teal equipment accents and a warm scarf. No real military insignia or firearm.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#17363b"/>
    <stop offset=".52" stop-color="#0d2227"/>
    <stop offset="1" stop-color="#081418"/>
  </linearGradient>
  <linearGradient id="jacket" x1=".15" y1="0" x2=".88" y2="1">
    <stop offset="0" stop-color="#3e494d"/>
    <stop offset=".48" stop-color="#262f33"/>
    <stop offset="1" stop-color="#151d20"/>
  </linearGradient>
  <linearGradient id="skin" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#c89674"/>
    <stop offset=".52" stop-color="#9a684f"/>
    <stop offset="1" stop-color="#714738"/>
  </linearGradient>
  <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d57a48"/>
    <stop offset=".55" stop-color="#a94f37"/>
    <stop offset="1" stop-color="#6d2e2a"/>
  </linearGradient>
  <radialGradient id="glow" cx=".72" cy=".22" r=".72">
    <stop offset="0" stop-color="#7ed0d0" stop-opacity=".26"/>
    <stop offset=".52" stop-color="#58a6a9" stop-opacity=".08"/>
    <stop offset="1" stop-color="#58a6a9" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="512" height="512" rx="42" fill="url(#bg)"/>
<rect width="512" height="512" rx="42" fill="url(#glow)"/>
<g opacity=".22" stroke="#77c5c8" stroke-width="2">
  <path d="M32 94H170M342 94H480"/>
  <path d="M32 418H158M354 418H480"/>
  <circle cx="430" cy="82" r="24" fill="none"/>
  <circle cx="430" cy="82" r="7" fill="none"/>
</g>
